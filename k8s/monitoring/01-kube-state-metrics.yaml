# kube-state-metrics exposes cluster-object metrics (pod phase, restarts,
# waiting/terminated reasons, readiness, etc.). These are what let us alert on
# CrashLoopBackOff, ImagePullBackOff, OOMKilled and "pod not ready" - signals
# that live in the Kubernetes API, not in the app itself.
# ---------- Identity: the ServiceAccount kube-state-metrics runs as ----------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics                  # the pod's identity for API calls
  namespace: monitoring
---
# ---------- Permissions: a read-only ClusterRole (list/watch across the cluster) ----------
apiVersion: rbac.authorization.k8s.io/v1    # RBAC objects use this API group
kind: ClusterRole                           # cluster-wide (not namespaced) permissions
metadata:
  name: kube-state-metrics
rules:
  - apiGroups: [""]                         # "" = the core API group
    resources:                              # object types it may read...
      - configmaps
      - secrets
      - nodes
      - pods
      - services
      - resourcequotas
      - replicationcontrollers
      - limitranges
      - persistentvolumeclaims
      - persistentvolumes
      - namespaces
      - endpoints
    verbs: ["list", "watch"]                # ...but ONLY list/watch (read-only)
  - apiGroups: ["apps"]                     # workload objects
    resources:
      - statefulsets
      - daemonsets
      - deployments
      - replicasets
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]                    # jobs/cronjobs
    resources:
      - cronjobs
      - jobs
    verbs: ["list", "watch"]
  - apiGroups: ["autoscaling"]             # HPAs
    resources:
      - horizontalpodautoscalers
    verbs: ["list", "watch"]
---
# ---------- Binding: attach the ClusterRole above to the ServiceAccount ----------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
roleRef:                                    # WHICH permissions to grant
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:                                   # TO WHOM they are granted
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: monitoring
---
# ---------- The kube-state-metrics Deployment itself ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics  # run as the SA above (grants the RBAC)
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
          ports:
            - name: http-metrics
              containerPort: 8080           # exposes generated metrics on 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-metrics
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http-metrics
            initialDelaySeconds: 5
---
# ---------- Service: stable name Prometheus scrapes at :8080 ----------
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics                  # DNS: kube-state-metrics.monitoring.svc
  namespace: monitoring
  labels:
    app: kube-state-metrics
spec:
  selector:
    app: kube-state-metrics
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
  type: ClusterIP
