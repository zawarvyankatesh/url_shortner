# Prometheus discovers what to scrape by querying the Kubernetes API
# (service discovery). It therefore needs read-only permission to list pods,
# services, endpoints and nodes across the cluster.
# ---------- Identity Prometheus runs as ----------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
# ---------- Read-only permissions Prometheus needs for pod service-discovery ----------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]                         # core API group
    resources:
      - nodes
      - nodes/metrics
      - services
      - endpoints
      - pods                                # needed to discover pods to scrape
    verbs: ["get", "list", "watch"]         # read-only
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get"]                          # read its own config
  - nonResourceURLs: ["/metrics"]           # permission for non-object URLs
    verbs: ["get"]
---
# ---------- Bind the ClusterRole to the ServiceAccount ----------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus                          # grant the "prometheus" ClusterRole above
subjects:
  - kind: ServiceAccount
    name: prometheus                        # to the "prometheus" ServiceAccount
    namespace: monitoring
