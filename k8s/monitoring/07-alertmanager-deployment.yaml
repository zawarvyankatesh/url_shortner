# ---------- Alertmanager Deployment: receives fired alerts, groups + routes them ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"  # routing/receiver config
            - "--storage.path=/alertmanager"                      # silence/state storage
          ports:
            - name: web
              containerPort: 9093           # Alertmanager receives alerts on this port
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager  # alertmanager.yml lands here
            - name: data
              mountPath: /alertmanager
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
            initialDelaySeconds: 5
      volumes:
        - name: config
          configMap:
            name: alertmanager-config       # from 06-alertmanager-config.yaml
        - name: data
          emptyDir: {}
---
# ---------- Service: Prometheus sends alerts to alertmanager.monitoring.svc:9093 ----------
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
spec:
  selector:
    app: alertmanager
  ports:
    - name: web
      port: 9093
      targetPort: web
  type: ClusterIP
