# Alertmanager configuration. It receives fired alerts from Prometheus,
# groups/deduplicates them, and routes them to a "receiver". For now the
# receiver is a webhook echo service so you can SEE the alert payload. In a
# later phase this webhook URL becomes our AI incident-analysis agent.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m                   # mark an alert resolved if not re-sent within 5m

    route:                                  # the default routing tree for all alerts
      # group alerts of the same type/namespace into one notification
      group_by: ["alertname", "namespace"]
      group_wait: 30s                       # wait 30s to collect more of the same group first
      group_interval: 5m                    # min gap before sending updates for a group
      repeat_interval: 1h                   # re-send an unresolved alert at most hourly
      receiver: "webhook-receiver"          # which receiver below to send to

    receivers:
      - name: "webhook-receiver"
        webhook_configs:
          # The AI incident-analysis agent. (During early testing you can point
          # this back at http://alert-receiver.monitoring.svc:8080/ to just see
          # the raw payload.)
          - url: "http://incident-agent.ai-agent.svc:8080/alert"  # cross-namespace Service DNS
            send_resolved: true             # also notify when the alert clears
