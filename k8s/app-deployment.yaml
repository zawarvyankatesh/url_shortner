# ---------- URL Shortener Deployment: runs the FastAPI app pods ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener
  namespace: url-shortener
  labels:
    app: url-shortener
    app.kubernetes.io/part-of: url-shortener
spec:
  replicas: 2                               # two identical pods for availability/load
  selector:
    matchLabels:
      app: url-shortener                    # manage pods labeled app=url-shortener
  template:                                 # ---- pod blueprint ----
    metadata:
      labels:
        app: url-shortener                  # matched by the selector above AND the Service
      annotations:                          # metadata read by other tools (not by K8s itself)
        # These 3 tell Prometheus how to auto-discover and scrape these pods.
        prometheus.io/scrape: "true"        # opt in to scraping
        prometheus.io/port: "8000"          # scrape this container port
        prometheus.io/path: "/metrics"      # scrape this HTTP path
    spec:
      containers:
        - name: url-shortener
          # Immutable tags are better for prod; using :latest here so kind pulls
          # the newest build. Swap to a git-SHA tag when you want reproducibility.
          image: vyankateshzawar/url-shortener:latest  # image built by CodeBuild, pulled from Docker Hub
          imagePullPolicy: Always           # always re-pull (needed because tag is :latest)
          ports:
            - name: http                    # named port; probes/Service reference "http"
              containerPort: 8000           # port uvicorn listens on inside the container
          envFrom:
            - configMapRef:
                name: url-shortener-config   # inject ALL ConfigMap keys as env vars
          resources:
            requests:                       # guaranteed minimum for scheduling
              cpu: 50m
              memory: 64Mi
            limits:                         # hard ceiling; memory over 256Mi -> OOMKilled
              cpu: 250m
              memory: 256Mi
          livenessProbe:                    # alive? if it fails 3x, K8s RESTARTS the container
            httpGet:
              path: /healthz                # simple check that never touches Redis
              port: http
            initialDelaySeconds: 5          # give the app 5s to boot first
            periodSeconds: 10               # check every 10s
            failureThreshold: 3             # 3 consecutive fails = restart
          readinessProbe:                   # can serve? if it fails, K8s stops routing traffic
            httpGet:
              path: /readyz                 # returns 503 when Redis is down
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
